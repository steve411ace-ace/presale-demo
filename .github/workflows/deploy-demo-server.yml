# Windows runner name: demo-server; label: demo-server. MUST run with local Administrator privileges.
# Install the runner on the demo server; outbound HTTPS to GitHub is sufficient.
name: Deploy Presales Demo to demo server

'on':
  workflow_dispatch:

env:
  # Confirmed by An on 13/11: IIS site PresaleDemo differs from folder PresalesDemo and repo presale-demo.
  SITE_NAME: 'PresaleDemo'
  # Existing demo server port.
  PORT: '9001'
  # Confirmed by An on 13/11: IIS physical path, used as the publish directory.
  # Source checkout uses the runner workspace independently of this path.
  PUBLISH_PATH: 'C:\OneHR\PresalesDemo'
  # SQL host WIN-7IFVHOS4KCR: SQLEXPRESS runs locally on the demo server.
  # Script only performs CREATE DATABASE IF NOT EXISTS; the restored DB already exists, so this is a no-op.
  SQL_INSTANCE: 'localhost\SQLEXPRESS'
  # Existing application database name.
  DATABASE: 'PresalesDemo'
  # Public HTTPS base URL, without a trailing slash.
  PUBLIC_URL: 'https://demo.ezhrsolution.com:9001'

permissions:
  contents: read

# Prevent overlapping deployments from overwriting each other's configuration.
concurrency:
  group: deploy-demo-server
  cancel-in-progress: false

jobs:
  deploy:
    # The demo server runner name/label is demo-server; pin it to avoid deploying to another machine when more runners are added.
    runs-on: [self-hosted, demo-server]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Log confirmed deployment settings
        run: |
          Write-Host "Site: $env:SITE_NAME"
          Write-Host "Port: $env:PORT"
          Write-Host "Publish directory: $env:PUBLISH_PATH"
          Write-Host "SQL instance: $env:SQL_INSTANCE"
          Write-Host "Database: $env:DATABASE"
          "DEPLOY_STARTED_AT=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Verify checkout is current
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read checkout HEAD.' }
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checkout is stale: HEAD $head != GITHUB_SHA $env:GITHUB_SHA."
          }
          $status = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read checkout status.' }
          $trackedChanges = @($status | Where-Object { -not $_.StartsWith('??') })
          if ($trackedChanges.Count -gt 0) {
            throw "Checkout has local tracked changes:`n$($trackedChanges -join "`n")"
          }
          $untrackedFiles = @($status | Where-Object { $_.StartsWith('??') })
          if ($untrackedFiles.Count -gt 0) {
            Write-Warning "Checkout has untracked files:`n$($untrackedFiles -join "`n")"
          }
          $sourceFile = Join-Path $env:GITHUB_WORKSPACE 'wwwroot\index.html'
          $sourceHash = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash
          $sourceLastWriteTime = (Get-Item -LiteralPath $sourceFile).LastWriteTimeUtc.ToString('o')
          "- Checkout SHA: $head" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Checkout index.html SHA256: $sourceHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Checkout index.html LastWriteTime UTC: $sourceLastWriteTime" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "Checkout matches GITHUB_SHA: $head"

      - name: Check .NET 8 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            throw 'Can cai .NET 8 SDK tren server demo'
          }
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'Can cai .NET 8 SDK tren server demo' }
          $sdks = dotnet --list-sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.\d+\s')) {
            throw 'Can cai .NET 8 SDK tren server demo'
          }

      - name: Check local Administrator privileges
        run: |
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Runner phai chay voi quyen Administrator local tren server demo.'
          }

      - name: Back up published appsettings.json
        id: backup
        run: |
          $ErrorActionPreference = 'Stop'
          # Publish overwrites appsettings.json with repository placeholders. The
          # real connection string exists only in the server's published file.
          # Never print it to logs or commit it to git; never pass a connection string
          # argument to the deployment script. Preserve it via TEMP backup and always() restore.
          # Never delete the publish directory (uploads live there).
          $source = Join-Path $env:PUBLISH_PATH 'appsettings.json'
          if (Test-Path -LiteralPath $source -PathType Leaf) {
            $backup = Join-Path $env:TEMP ("presales-appsettings-{0}.json" -f [Guid]::NewGuid())
            Copy-Item -LiteralPath $source -Destination $backup -ErrorAction Stop
            "APPSETTINGS_BACKUP=$backup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Published appsettings.json backed up without exposing its contents.'
          } else {
            Write-Warning 'No published appsettings.json exists; skipping backup and restore. Deployment script configuration warning still applies.'
          }

      - name: Deploy to IIS
        id: publish
        run: |
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0
          .\deploy-to-iis.ps1 -SiteName $env:SITE_NAME -Port $env:PORT -PublishPath $env:PUBLISH_PATH -SqlInstance $env:SQL_INSTANCE -Database $env:DATABASE
          if ($LASTEXITCODE -ne 0) { throw "Deployment native command failed with exit code $LASTEXITCODE" }

      - name: Verify published file matches checkout source
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceFile = Join-Path $env:GITHUB_WORKSPACE 'wwwroot\index.html'
          $publishedFile = Join-Path $env:PUBLISH_PATH 'wwwroot\index.html'
          if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
            throw "Checkout source file not found: $sourceFile"
          }
          if (-not (Test-Path -LiteralPath $publishedFile -PathType Leaf)) {
            throw "Published file not found: $publishedFile"
          }
          $sourceHash = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256).Hash
          "CHECKOUT_INDEX_HASH=$sourceHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHED_INDEX_HASH=$publishedHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "- Checkout index.html SHA256: $sourceHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Published index.html SHA256: $publishedHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($sourceHash -ne $publishedHash) {
            throw "Published file does not match checked-out source. Checkout hash: $sourceHash, published hash: $publishedHash."
          }
          Write-Host "Published index.html matches checked-out source. SHA256: $sourceHash"

      - name: Restore published appsettings.json
        if: ${{ always() && steps.backup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPSETTINGS_BACKUP -and (Test-Path -LiteralPath $env:APPSETTINGS_BACKUP -PathType Leaf)) {
            Copy-Item -LiteralPath $env:APPSETTINGS_BACKUP -Destination (Join-Path $env:PUBLISH_PATH 'appsettings.json') -Force
            # The deploy script already started IIS; reload the restored configuration.
            Import-Module WebAdministration -ErrorAction Stop
            if (Test-Path "IIS:\AppPools\$env:SITE_NAME") {
              if ((Get-WebAppPoolState -Name $env:SITE_NAME).Value -eq 'Started') {
                Restart-WebAppPool -Name $env:SITE_NAME
              }
            }
            Remove-Item -LiteralPath $env:APPSETTINGS_BACKUP -Force
            Write-Host 'Original published appsettings.json restored.'
          }

      - name: Verify uploaded survey media survived
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaPath = Join-Path $env:PUBLISH_PATH 'wwwroot\uploads\survey-media'
          if (-not (Test-Path -LiteralPath $mediaPath -PathType Container)) {
            throw 'Thu muc survey-media bi mat sau deploy.'
          }
          $file = Get-ChildItem -LiteralPath $mediaPath -File -Recurse | Select-Object -First 1
          if (-not $file) { throw 'Thu muc survey-media khong con file sau deploy.' }
          Write-Host 'Survey media directory exists and contains files.'

      - name: Check public API health
        id: public_api_health
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "$($env:PUBLIC_URL)/api/health"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30
              $body = $response.Content | ConvertFrom-Json
              if ($response.StatusCode -ne 200 -or $body.ok -isnot [bool] -or $body.ok -ne $true) {
                throw 'API public phai tra HTTP 200 va JSON ok dung kieu bool, bang true.'
              }
              Write-Host 'Public API health: HTTP 200, ok=true.'
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Kiem tra API public lan $attempt that bai; thu lai sau 5 giay."
              Start-Sleep -Seconds 5
            }
          }

      - name: Check public pages
        id: public_health
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('/', '/khao-sat.html')) {
            $uri = "$($env:PUBLIC_URL)$path"
            $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30
            if ($response.StatusCode -ne 200) { throw "Public health failed: $uri" }
            Write-Host "Public health: $uri returned HTTP 200."
          }

      - name: Verify served index.html matches published file
        id: served_hash
        run: |
          $ErrorActionPreference = 'Stop'
          $publishedFile = Join-Path $env:PUBLISH_PATH 'wwwroot\index.html'
          if (-not (Test-Path -LiteralPath $publishedFile -PathType Leaf)) {
            throw "Khong tim thay file index.html da publish: $publishedFile"
          }
          $publishedHash = (Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256).Hash
          "PUBLISHED_INDEX_HASH=$publishedHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $servedFile = Join-Path $env:TEMP ("presales-index-{0}.html" -f [Guid]::NewGuid().ToString('N'))
          $uri = "$($env:PUBLIC_URL)/index.html?cb=$([Guid]::NewGuid().ToString('N'))"
          try {
            Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30 -OutFile $servedFile
            $servedHash = (Get-FileHash -LiteralPath $servedFile -Algorithm SHA256).Hash
            "SERVED_INDEX_HASH=$servedHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($publishedHash -ne $servedHash) {
              throw "Site dang phuc vu file cu, publish chua toi dung thu muc IIS. Published hash: $publishedHash, served hash: $servedHash."
            }
            Write-Host "Served index.html matches published file. SHA256: $publishedHash"
          } finally {
            if (Test-Path -LiteralPath $servedFile -PathType Leaf) {
              Remove-Item -LiteralPath $servedFile -Force
            }
          }

      - name: Diagnose served files
        id: diagnose
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Continue'
          function Write-Diagnostic($label, $value) {
            "- ${label}: $value" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          function Get-ShortError($record) {
            $message = $record.Exception.Message -replace '[\r\n]+', ' '
            $message.Substring(0, [Math]::Min(240, $message.Length))
          }
          '## Diagnose served files' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $iisError = $null
          try {
            Import-Module WebAdministration -ErrorAction Stop
          } catch {
            $iisError = Get-ShortError $_
            Write-Diagnostic 'Module IIS' "Unavailable: $iisError"
          }
          try {
            if ($iisError) { throw $iisError }
            if (Test-Path "IIS:\Sites\$env:SITE_NAME" -ErrorAction Stop) {
              Write-Diagnostic 'Duong dan vat ly IIS' (Get-Item "IIS:\Sites\$env:SITE_NAME" -ErrorAction Stop).physicalPath
            } else {
              Write-Diagnostic 'Duong dan vat ly IIS' 'Site not found in IIS'
            }
          } catch {
            Write-Diagnostic 'Duong dan vat ly IIS' "Unavailable: $(Get-ShortError $_)"
          }
          try {
            if ($iisError) { throw $iisError }
            $bindings = @(Get-WebBinding -Name $env:SITE_NAME -ErrorAction Stop | Select-Object protocol, bindingInformation)
            if ($bindings.Count -eq 0) { Write-Diagnostic 'Binding IIS' 'Khong co binding' }
            foreach ($binding in $bindings) {
              Write-Diagnostic 'Binding IIS' "$($binding.protocol) $($binding.bindingInformation)"
            }
          } catch {
            Write-Diagnostic 'Binding IIS' "Unavailable: $(Get-ShortError $_)"
          }
          try {
            if ($iisError) { throw $iisError }
            if (Test-Path "IIS:\AppPools\$env:SITE_NAME" -ErrorAction Stop) {
              Write-Diagnostic 'Trang thai app pool' (Get-WebAppPoolState -Name $env:SITE_NAME -ErrorAction Stop).Value
            } else {
              Write-Diagnostic 'Trang thai app pool' 'App pool not found'
            }
          } catch {
            Write-Diagnostic 'Trang thai app pool' "Unavailable: $(Get-ShortError $_)"
          }
          try {
            $publishedFile = Join-Path $env:PUBLISH_PATH 'wwwroot\index.html'
            if (Test-Path -LiteralPath $publishedFile -PathType Leaf -ErrorAction Stop) {
              try {
                Write-Diagnostic 'File publish SHA256' (Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256 -ErrorAction Stop).Hash
              } catch {
                Write-Diagnostic 'File publish SHA256' "Unavailable: $(Get-ShortError $_)"
              }
              try {
                Write-Diagnostic 'File publish sua cuoi UTC' (Get-Item -LiteralPath $publishedFile -ErrorAction Stop).LastWriteTimeUtc.ToString('o')
              } catch {
                Write-Diagnostic 'File publish sua cuoi UTC' "Unavailable: $(Get-ShortError $_)"
              }
              try {
                $guard = if (Select-String -LiteralPath $publishedFile -Pattern 'sc && sc._storyEdited' -SimpleMatch -ErrorAction Stop) { 'Yes' } else { 'No' }
                Write-Diagnostic 'File publish co guard' $guard
              } catch {
                Write-Diagnostic 'File publish co guard' "Unavailable: $(Get-ShortError $_)"
              }
            } else {
              Write-Diagnostic 'File publish' 'Published file not found'
            }
          } catch {
            Write-Diagnostic 'File publish' "Unavailable: $(Get-ShortError $_)"
          }
          $servedFile = $null
          try {
            $servedFile = Join-Path $env:TEMP ("presales-diagnose-{0}.html" -f [Guid]::NewGuid().ToString('N'))
            $uri = "$($env:PUBLIC_URL)/index.html?cb=$([Guid]::NewGuid().ToString('N'))"
            Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 30 -OutFile $servedFile -ErrorAction Stop
            try {
              Write-Diagnostic 'File phuc vu SHA256' (Get-FileHash -LiteralPath $servedFile -Algorithm SHA256 -ErrorAction Stop).Hash
            } catch {
              Write-Diagnostic 'File phuc vu SHA256' "Unavailable: $(Get-ShortError $_)"
            }
            try {
              $guard = if (Select-String -LiteralPath $servedFile -Pattern 'sc && sc._storyEdited' -SimpleMatch -ErrorAction Stop) { 'Yes' } else { 'No' }
              Write-Diagnostic 'File phuc vu co guard' $guard
            } catch {
              Write-Diagnostic 'File phuc vu co guard' "Unavailable: $(Get-ShortError $_)"
            }
          } catch {
            Write-Diagnostic 'File phuc vu' "Download failed: $(Get-ShortError $_)"
          } finally {
            try {
              if ($servedFile -and (Test-Path -LiteralPath $servedFile -PathType Leaf -ErrorAction Stop)) {
                Remove-Item -LiteralPath $servedFile -Force -ErrorAction Stop
              }
            } catch {
              Write-Diagnostic 'Xoa file tam' "Unavailable: $(Get-ShortError $_)"
            }
          }
          exit 0

      - name: Write deployment summary
        if: ${{ always() }}
        env:
          PUBLIC_API_HEALTH_RESULT: ${{ steps.public_api_health.outcome }}
          SERVED_HASH_RESULT: ${{ steps.served_hash.outcome }}
          CHECKOUT_INDEX_HASH: ${{ env.CHECKOUT_INDEX_HASH }}
          PUBLISHED_INDEX_HASH: ${{ env.PUBLISHED_INDEX_HASH }}
          SERVED_INDEX_HASH: ${{ env.SERVED_INDEX_HASH }}
          PUBLIC_HEALTH_RESULT: ${{ steps.public_health.outcome }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          $finished = [DateTime]::UtcNow
          $duration = 'Unavailable'
          if ($env:DEPLOY_STARTED_AT) {
            $duration = '{0:N1} seconds' -f ($finished - [DateTime]::Parse($env:DEPLOY_STARTED_AT).ToUniversalTime()).TotalSeconds
          }
          $checkoutHashDisplay = if ($env:CHECKOUT_INDEX_HASH) { $env:CHECKOUT_INDEX_HASH } else { 'Unavailable' }
          $publishedHashDisplay = if ($env:PUBLISHED_INDEX_HASH) { $env:PUBLISHED_INDEX_HASH } else { 'Unavailable' }
          $servedHashDisplay = if ($env:SERVED_INDEX_HASH) { $env:SERVED_INDEX_HASH } else { 'Unavailable' }
          @"
          ## Demo server deployment
          - Result: $env:DEPLOY_RESULT
          - Site: $env:SITE_NAME
          - Port: $env:PORT
          - Publish directory: $env:PUBLISH_PATH
          - Public API health: $env:PUBLIC_API_HEALTH_RESULT
          - Served index.html hash match: $env:SERVED_HASH_RESULT
          - Checkout index.html SHA256: $checkoutHashDisplay
          - Published index.html SHA256: $publishedHashDisplay
          - Served index.html SHA256: $servedHashDisplay
          - Public health ($env:PUBLIC_URL/ and /khao-sat.html): $env:PUBLIC_HEALTH_RESULT
          - Started (UTC): $env:DEPLOY_STARTED_AT
          - Finished (UTC): $($finished.ToString('o'))
          - Duration: $duration
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
